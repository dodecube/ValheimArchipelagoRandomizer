---
# YAML для твоего друга — Valheim Archipelago Randomizer
# Этот файл используется ПРИ ГЕНЕРАЦИИ сида на сайте archipelago.gg или в локальном Archipelago.
# Сам .apworld настраивать не нужно — все настройки игры задаются здесь.

# 1. Имя слота. ВАЖНО: точно это же имя нужно будет ввести в моде в поле Slot при подключении к серверу.
name: Friend
# 2. Игра. Должно быть именно так:
game: Valheim
# 3. Описание (не обязательно, просто для себя)
description: Valheim randomizer для друга

# Минимальная версия AP для этого apworld (см. apworld/valheim/archipelago.json)
requires:
  version: 0.6.7

Valheim:
  # === ГЛАВНАЯ НАСТРОЙКА: Цель игры (Goal Boss) ===
  # Какой трофей босса нужно ПОДОБРАТЬ, чтобы засчиталось прохождение.
  # Варианты (пиши ровно так, регистр не важен):
  #   Eikthyr   — Эйктюр (самый короткий забег, Tier 1)
  #   TheElder  — Старейшина (короткий, Tier 4)
  #   Bonemass  — Масса костей (средний, Tier 4)
  #   Moder     — Моудер (средне-длинный, Tier 7)
  #   Yagluth   — Яглут (длинный, Tier 8)
  #   Queen     — Королева (очень длинный, Tier 10)
  #   Fader     — Фадер, Ashlands (максимальный, Tier 11, вся игра)
  #
  # Если опцию не указать вообще — по умолчанию будет Eikthyr.
  goal: TheElder

  # === Подарки и проказы (AP-предметы для игрока Valheim) ===
  # Сколько предметов-подарков добавить в пул (0-6). Подарок = связка ресурсов,
  # которая спавнится рядом с игроком Valheim при получении:
  # Wood Bundle (дерево x50), Stone Cache, Coal Stash, Honey Pot, Coin Purse, Cooked Feast.
  # В мультиигре подарки могут лежать на чеках ЛЮБОГО игрока — делая свои чеки
  # в своей игре, ты отправляешь подарки другу в Valheim.
  gifts: 4

  # Сколько предметов-проказ добавить в пул (0-3, классификация Trap). Пранк =
  # враждебные мобы рядом с игроком Valheim при получении:
  # Greydwarf Ambush (3 грейдворфа), Hungry Wolves (2 волка),
  # Angry Troll (тролль), Deathsquito Swarm (3 сквита).
  pranks: 2

  # === Стандартные опции Archipelago (работают во всех играх) ===
  # Их можно не трогать, но иногда полезно:

  # Кто может помочь с прохождением логики: full / minimal / locations
  # Для Valheim лучше оставить locations.
  accessibility: locations

  # Стартовый инвентарь: предметы, которые дадут сразу на старте.
  # Названия должны совпадать с именами предметов из Items.py, например "Crafting".
  # Пример: дать верстак сразу:
  # start_inventory:
  #   Crafting: 1

  # Подсказки на старте (бесплатные хинты)
  # start_hints: []

  # Локации, которые точно не должны содержать прогресс (например, сложные трофеи)
  # exclude_locations: []

  # Локации, куда генератор ПОСТАРАЕТСЯ положить что-то важное
  # priority_locations: []
