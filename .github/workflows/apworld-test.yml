name: apworld generation test

# Validates the Valheim apworld against real Archipelago core:
#  - rebuilds valheim.apworld from source (so source and binary can't drift)
#  - generates 3 seeds covering gifts/pranks on/off and multiworld
#  - checks the Items.py <-> GiftSpawning.cs name contract
on:
  push:
    paths:
      - 'apworld/**'
      - 'src/GiftSpawning.cs'
      - 'src/ValheimRandomizer.cs'
      - 'tests/**'
      - '.github/workflows/apworld-test.yml'
  pull_request:
    paths:
      - 'apworld/**'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone Archipelago core (pinned 0.6.7)
        run: git clone --depth 1 --branch 0.6.7 https://github.com/ArchipelagoMW/Archipelago ap-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ap-core/requirements.txt
          for f in ap-core/worlds/*/requirements.txt; do python -m pip install -r "$f"; done

      - name: Rebuild apworld from source and install it
        run: |
          cd apworld && rm -f valheim.apworld && zip -qr valheim.apworld valheim && cd ..
          mkdir -p ap-core/custom_worlds
          cp apworld/valheim.apworld ap-core/custom_worlds/

      - name: Check apworld <-> mod name contract
        run: |
          python - <<'EOF'
          import re
          py = set(re.findall(r'"((?:Gift|Prank): [^"]+)"', open('apworld/valheim/Items.py').read()))
          cs = set(re.findall(r'"((?:Gift|Prank): [^"]+)"', open('src/GiftSpawning.cs').read()))
          assert py, "no gifts found in Items.py"
          assert py == cs, f"gift name mismatch: {py ^ cs}"
          locs = set(re.findall(r'Explore,(Entered: [^,]+),', open('apworld/valheim/Locations.py').read()))
          events = set(re.findall(r'CreateEventLocation\("([^"]+)", "(Entered: [^"]+)"\)', open('src/ValheimRandomizer.cs').read()))
          assert locs, "no Explore locations found"
          assert locs == {name for _, name in events}, f"biome location mismatch: {locs ^ {n for _, n in events}}"
          game_ids = set(re.findall(r'Explore,Entered: [^,]+,loc:([^,]+),', open('apworld/valheim/Locations.py').read()))
          assert game_ids == {eid for eid, _ in events}, f"biome event id mismatch: {game_ids ^ {e for e, _ in events}}"
          print(f"contract OK: {len(py)} gifts/pranks, {len(locs)} biome checks")
          EOF

      - name: Generate test seeds
        run: |
          mkdir -p out/solo-max out/solo-zero out/mixed
          cd ap-core
          python Generate.py --player_files_path ../tests/ci/solo-max --seed 111 --spoiler 0 --outputpath ../out/solo-max
          python Generate.py --player_files_path ../tests/ci/solo-zero --seed 222 --spoiler 0 --outputpath ../out/solo-zero
          python Generate.py --player_files_path ../tests/ci/mixed --seed 777 --spoiler 0 --outputpath ../out/mixed

      - name: Assert outputs exist
        run: |
          ls out/solo-max/AP_*.zip out/solo-zero/AP_*.zip out/mixed/AP_*.zip
          echo "All 3 test seeds generated successfully."
