name: build DLL (self-hosted)

# Builds ValheimRandomizer.dll on YOUR machine via a self-hosted runner.
# Cloud build is impossible: compilation needs Valheim's game DLLs,
# which are copyrighted and cannot be uploaded to GitHub.
#
# Setup (once): see BUILD.md "Автосборка DLL через GitHub Actions".
# The job auto-skips until VALHEIM_GAME_DIR repo variable is set.
on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'build.ps1'
      - '.github/workflows/build-dll.yml'
  workflow_dispatch:

jobs:
  build:
    if: ${{ vars.VALHEIM_GAME_DIR != '' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: powershell -ExecutionPolicy Bypass -File build.ps1 -GameDir "${{ vars.VALHEIM_GAME_DIR }}" -ProfileDir "${{ vars.R2_PROFILE_DIR }}"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ValheimRandomizer-dll
          path: src/bin/Release/netstandard2.1/ValheimRandomizer.dll
          if-no-files-found: error
